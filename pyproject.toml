[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sotto"
version = "0.1.0"
description = "Невидимый ИИ-суфлёр для собеседований под Linux/Hyprland: подсказки, запись, поиск, тренеры, вакансии"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi", "uvicorn", "httpx", "jinja2", "python-multipart", "pydantic",
  "numpy", "sherpa-onnx>=1.12,<2", "faster-whisper", "fastembed", "sqlite-vec",
  "PySide6", "markdown",
]

[project.optional-dependencies]
# Windows 11: захват звука WASAPI (soundcard), скриншоты (mss + pillow). FFmpeg — отдельно, не из pip.
windows = ["soundcard", "mss", "pillow"]
# Вакансии и PDF-резюме: тяжёлые и нужны не всем — pip install sotto[jobs]. Playwright тянет Chromium
# (playwright install chromium), weasyprint на Windows требует GTK/Pango — см. README.
jobs = ["telethon", "playwright", "weasyprint"]

[dependency-groups]
# Инструменты разработки: uv sync --group dev (nix не нужен). CUDA для локального Whisper — отдельно, см. README.
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "pre-commit"]

[project.scripts]
sotto = "sotto.cli:main"

[tool.setuptools.packages.find]
include = ["sotto*"]

[tool.setuptools.package-data]
sotto = ["interfaces/web/templates/*.html", "interfaces/web/static/*", "prompts/*.md", "interfaces/cli/sim/scenarios/*.toml", "experimental/translator/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["sotto/experimental"]

[tool.ruff.lint]
# pyflakes, pycodestyle, сортировка импортов, современный синтаксис, частые ошибки
select = ["F", "E", "W", "I", "UP", "B"]
ignore = [
  "E501",    # длину строк держит форматирование кода, а не линтер (русские комментарии длинные)
  "B008",    # FastAPI: Form(...) в аргументах — так задумано
  "UP042",   # StrEnum уже используется где нужно
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
packages = ["sotto.domain", "sotto.application", "sotto.jobs.domain", "sotto.jobs.application"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "sotto.domain.*"
disallow_untyped_defs = true
